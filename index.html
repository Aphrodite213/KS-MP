<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIS Alliance Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:#8b93a1;font-size:.85rem;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.card,.box{background:#181b22;border-radius:10px;padding:12px}
.box{margin-bottom:16px}
.card span{color:#8b93a1;font-size:.75rem}
.card b{display:block;font-size:1.15rem;margin-top:4px}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #2a2f3a;background:#0f1115;color:#e6e6e6;margin-bottom:10px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #232733}
th:first-child,td:first-child{text-align:left}
th{color:#8b93a1;cursor:pointer}
.up{color:#4ade80}.down{color:#f87171}
</style>
</head>
<body>
<h1>MIS Alliance Tracker</h1>
<div class="sub" id="sub">Loading…</div>

<div class="cards">
  <div class="card"><span>Members</span><b id="c-count">–</b></div>
  <div class="card"><span>Total power</span><b id="c-power">–</b></div>
  <div class="card"><span>Power change</span><b id="c-change">–</b></div>
  <div class="card"><span>Last update</span><b id="c-time">–</b></div>
</div>

<div class="box"><canvas id="chart" height="180"></canvas></div>

<div class="box">
  <input id="q" placeholder="Search members…">
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="name">Name</th><th data-k="rank">Rank</th>
        <th data-k="power">Power</th><th data-k="dp">Power Δ</th>
        <th data-k="kills">Kills</th><th data-k="dk">Kills Δ</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const fmt = n => n == null ? "–" : Math.round(n).toLocaleString();
const gain = n => n == null ? "–" : (n > 0 ? "+" : "") + Math.round(n).toLocaleString();
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseCSV(t) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

let members = [], sortKey = "power", sortDir = -1;

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const list = members.filter(m => m.name.toLowerCase().includes(q)).sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (typeof x === "string") return x.localeCompare(y) * sortDir;
    return ((x ?? -1e18) - (y ?? -1e18)) * sortDir;
  });
  document.getElementById("tbody").innerHTML = list.map(m =>
    `<tr><td>${esc(m.name)}</td><td>${esc(m.rank)}</td>
     <td>${fmt(m.power)}</td><td class="${cls(m.dp)}">${gain(m.dp)}</td>
     <td>${fmt(m.kills)}</td><td class="${cls(m.dk)}">${gain(m.dk)}</td></tr>`).join("");
}

fetch("data/snapshots.csv?" + Date.now())
  .then(r => r.text())
  .then(t => {
    const rows = parseCSV(t.trim()); rows.shift();
    const data = rows.filter(r => r.length >= 7).map(r => ({
      ts: +r[0], id: r[1], name: r[2], power: +r[3], kills: +r[4], rank: /^leader$/i.test(r[6]) ? "R5" : r[6]
    }));
    const byTs = {};
    data.forEach(d => (byTs[d.ts] = byTs[d.ts] || []).push(d));
    const times = Object.keys(byTs).map(Number).sort((a, b) => a - b);
    const latest = times[times.length - 1];
    const sum = ts => byTs[ts].reduce((s, d) => s + d.power, 0);

    // baseline = earlier snapshot closest to 7 days before the latest
    const prior = times.filter(x => x < latest);
    const target = latest - 7 * 86400;
    const baseTs = prior.length
      ? prior.reduce((a, b) => Math.abs(b - target) < Math.abs(a - target) ? b : a)
      : null;
    const baseMap = {};
    if (baseTs) byTs[baseTs].forEach(d => baseMap[d.id] = d);

    members = byTs[latest].map(d => {
      const b = baseMap[d.id];
      return { ...d, dp: b ? d.power - b.power : null, dk: b ? d.kills - b.kills : null };
    });

    document.getElementById("c-count").textContent = members.length;
    document.getElementById("c-power").textContent = fmt(sum(latest));
    const ch = document.getElementById("c-change");
    if (baseTs) { const d = sum(latest) - sum(baseTs); ch.textContent = gain(d); ch.className = cls(d); }
    document.getElementById("c-time").textContent =
      new Date(latest * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    document.getElementById("sub").textContent = baseTs
      ? "Changes since " + new Date(baseTs * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"})
      : "Changes appear after the second snapshot";

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: times.map(ts => new Date(ts * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit"})),
        datasets: [{ label: "Total power", data: times.map(sum), borderColor: "#60a5fa", tension: .2 }]
      },
      options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#8b93a1" } }, y: { ticks: { color: "#8b93a1" } } } }
    });

    render();
  })
  .catch(e => document.getElementById("sub").textContent = "Could not load data: " + e);

document.getElementById("q").addEventListener("input", render);
document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k;
  sortDir = (sortKey === k) ? -sortDir : -1;
  sortKey = k; render();
}));
</script>
</body>
</html>
